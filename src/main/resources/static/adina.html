<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0a1428">
    <title>Админ-панель — Countdown Hub</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0;
            height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 50% 0%, #12203a 0%, #0a1428 60%);
            color: #fff;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
            touch-action: manipulation;
        }

        /* ========== Экран входа ========== */
        .login-screen {
            position: fixed; inset: 0;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at 50% 0%, #12203a 0%, #0a1428 60%);
            z-index: 1000;
            padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
        }
        .login-box {
            background: rgba(255,255,255,0.04);
            padding: 36px 26px; border-radius: 24px; text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            width: 100%; max-width: 380px;
            backdrop-filter: blur(10px);
        }
        .login-box h2 {
            margin: 0 0 22px; font-size: 21px;
            background: linear-gradient(135deg, #a8d8ff, #3b82f6);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        .login-box input {
            padding: 14px; border-radius: 12px; border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.8); color: #fff;
            margin-bottom: 14px; width: 100%;
            text-align: center; font-size: 16px;
            -webkit-appearance: none; transition: border-color 0.2s;
        }
        .login-box input:focus { outline: none; border-color: #3b82f6; }
        .login-box button {
            padding: 14px 30px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff; font-weight: bold; cursor: pointer;
            width: 100%; font-size: 16px; min-height: 48px;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(59,130,246,0.3);
        }
        .login-box button:active { transform: scale(0.98); }

        /* ========== Приложение ========== */
        .app-container {
            display: flex; flex-direction: column;
            height: 100dvh; width: 100vw; position: relative;
        }

        /* ========== Верхняя панель ========== */
        .top-panel {
            display: flex; align-items: center;
            padding: 10px 12px;
            padding-top: calc(10px + env(safe-area-inset-top));
            background: rgba(13, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.07);
            min-height: 60px;
            flex-shrink: 0; gap: 10px;
        }
        .menu-btn {
            background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(139,92,246,0.15));
            border: 1px solid rgba(59,130,246,0.3);
            color: #a8d8ff; font-size: 15px; font-weight: 600;
            cursor: pointer; padding: 0 14px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            gap: 8px;
            height: 42px; flex-shrink: 0;
            transition: all 0.2s;
        }
        .menu-btn:active { transform: scale(0.96); background: rgba(59,130,246,0.25); }
        .menu-btn .icon { font-size: 18px; }
        .menu-btn .text { display: inline; }
        @media (max-width: 380px) {
            .menu-btn .text { display: none; }
            .menu-btn { padding: 0 12px; }
        }

        .chat-title {
            font-weight: 600; font-size: 15px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            flex: 1; min-width: 0; color: #e2e8f0;
        }
        .top-actions { display: flex; align-items: center; flex-shrink: 0; }

        /* ========== Область чата ========== */
        .main-chat {
            flex: 1; display: flex; flex-direction: column;
            background: transparent; min-width: 0; min-height: 0;
        }

        .messages {
            flex: 1; overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding: 16px 14px;
            display: flex; flex-direction: column; gap: 10px;
            min-height: 0;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg {
            padding: 11px 15px; border-radius: 16px;
            max-width: 85%; font-size: 15px; line-height: 1.45;
            word-break: break-word;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
            min-width: 0;
            animation: msgIn 0.25s ease;
        }
        .msg.user {
            align-self: flex-start;
            background: linear-gradient(135deg, #1e293b, #1a2438);
            border: 1px solid rgba(255,255,255,0.06);
            border-bottom-left-radius: 5px;
        }
        .msg.admin {
            align-self: flex-end;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-bottom-right-radius: 5px;
            box-shadow: 0 4px 14px rgba(59,130,246,0.28);
        }

        /* ========== Ввод ========== */
        .input-area {
            padding: 10px 12px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            border-top: 1px solid rgba(255,255,255,0.07);
            display: flex; gap: 8px; align-items: center;
            background: rgba(13, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1; padding: 12px 18px;
            border-radius: 24px;
            border: 1px solid #334155;
            background: rgba(30, 41, 59, 0.7);
            color: #fff; outline: none; font-size: 16px;
            min-width: 0; font-family: inherit;
            -webkit-appearance: none;
            transition: border-color 0.2s, background 0.2s;
        }
        .input-area input:focus {
            border-color: #3b82f6;
            background: rgba(30, 41, 59, 0.95);
        }
        .input-area button {
            width: 46px; height: 46px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none; color: #fff;
            border-radius: 50%; cursor: pointer;
            font-size: 18px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(59,130,246,0.35);
            padding: 0;
        }
        .input-area button:active:not(:disabled) { transform: scale(0.92); }
        .input-area button:disabled {
            opacity: 0.35; cursor: not-allowed;
            box-shadow: none;
        }

        .btn-close {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444; border: 1px solid rgba(239,68,68,0.5);
            padding: 8px 14px; border-radius: 10px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            min-height: 36px; white-space: nowrap;
            transition: all 0.2s;
        }
        .btn-close:active { background: #ef4444; color: #fff; transform: scale(0.96); }
        .badge-closed {
            color: #ef4444; font-weight: 600; font-size: 12px;
            padding: 6px 10px; border: 1px solid rgba(239,68,68,0.5);
            border-radius: 10px; background: rgba(239,68,68,0.1);
        }

        .empty {
            margin: auto; color: #64748b; text-align: center;
            padding: 30px 20px; font-size: 14px; line-height: 1.6;
        }
        .empty .big-icon {
            font-size: 52px; margin-bottom: 14px;
            opacity: 0.5;
        }

        /* ========== Сайдбар ========== */
        .sidebar {
            position: fixed; top: 0; left: -100%;
            width: 100%;
            max-width: 420px;
            height: 100dvh;
            background: linear-gradient(180deg, #0f1d35 0%, #0a1428 100%);
            border-right: 1px solid rgba(255,255,255,0.08);
            z-index: 100; transition: left 0.32s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex; flex-direction: column;
            box-shadow: 5px 0 40px rgba(0,0,0,0.5);
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .sidebar.open { left: 0; }
        .sidebar-header {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0;
        }
        .sidebar-header h2 {
            margin: 0; font-size: 18px; font-weight: 700;
            background: linear-gradient(135deg, #a8d8ff, #3b82f6);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-header .count {
            font-size: 12px; color: #64748b;
            background: rgba(255,255,255,0.05);
            padding: 3px 8px; border-radius: 10px;
            margin-left: 8px;
            -webkit-text-fill-color: #94a3b8;
        }
        .close-btn {
            background: rgba(255,255,255,0.05); border: none;
            color: #a8d8ff; font-size: 20px; cursor: pointer;
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px;
            transition: background 0.2s;
        }
        .close-btn:active { background: rgba(255,255,255,0.15); }

        .chat-list {
            flex: 1; overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }
        .chat-item {
            padding: 14px 18px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            cursor: pointer; transition: background 0.15s;
            display: flex; align-items: center; gap: 12px;
        }
        .chat-item:active { background: rgba(255,255,255,0.06); }
        .chat-item.active {
            background: linear-gradient(90deg, rgba(59,130,246,0.2), transparent);
            border-left: 3px solid #3b82f6;
            padding-left: 15px;
        }
        .chat-item .avatar {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 18px;
            flex-shrink: 0;
            box-shadow: 0 3px 10px rgba(59,130,246,0.3);
            color: #fff;
        }
        .chat-item.closed .avatar {
            background: linear-gradient(135deg, #64748b, #475569);
            box-shadow: none;
        }
        .chat-item .chat-info { flex: 1; min-width: 0; }
        .chat-item .id {
            font-size: 13px; color: #e2e8f0; font-weight: 600;
            display: flex; align-items: center; gap: 6px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .chat-item .id .lock { font-size: 11px; opacity: 0.7; flex-shrink: 0; }
        .chat-item .preview {
            font-size: 13px; color: #94a3b8;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-top: 3px;
        }
        .chat-item .badge-count {
            font-size: 11px; font-weight: 700;
            background: #3b82f6; color: #fff;
            min-width: 20px; height: 20px; padding: 0 6px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .chat-item.closed .badge-count {
            background: #475569;
        }
        .chat-item.closed { opacity: 0.65; }

        /* Оверлей */
        .overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 99; opacity: 0;
            pointer-events: none; transition: opacity 0.3s;
        }
        .overlay.open { opacity: 1; pointer-events: auto; }

        /* Тосты */
        .toast {
            position: fixed;
            left: 50%; transform: translateX(-50%) translateY(-20px);
            top: calc(20px + env(safe-area-inset-top));
            background: #ef4444; color: #fff;
            padding: 12px 22px; border-radius: 14px;
            font-size: 14px; font-weight: 600;
            opacity: 0; pointer-events: none;
            transition: all 0.3s; z-index: 2000;
            box-shadow: 0 8px 28px rgba(0,0,0,0.5);
            max-width: 90vw;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- Экран входа -->
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <h2>Вход в Админку</h2>
        <input type="password" id="password" placeholder="Пароль" autocomplete="current-password"
               onkeypress="if(event.key==='Enter') login()">
        <button onclick="login()">Войти</button>
    </div>
</div>

<!-- Оверлей -->
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- Основной интерфейс -->
<div class="app-container" id="appContainer" style="display:none">

    <div class="top-panel">
        <button class="menu-btn" onclick="toggleSidebar()" aria-label="Список чатов">
            <span class="icon">💬</span>
            <span class="text">Чаты</span>
        </button>
        <div class="chat-title" id="chatTitle">Выберите диалог</div>
        <div class="top-actions" id="chatActions"></div>
    </div>

    <div class="main-chat">
        <div class="messages" id="messages">
            <div class="empty">
                <div class="big-icon">💬</div>
                Нажмите на кнопку «Чаты» сверху,<br>чтобы выбрать диалог
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="replyInput" placeholder="Написать ответ..."
                   disabled enterkeyhint="send" autocomplete="off">
            <button id="replyBtn" disabled onclick="sendReply()" aria-label="Отправить">➤</button>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Диалоги <span class="count" id="chatCount">0</span></h2>
            <button class="close-btn" onclick="toggleSidebar()" aria-label="Закрыть">✕</button>
        </div>
        <div class="chat-list" id="chatList">
            <div style="padding:20px;color:#64748b;text-align:center;">Загрузка...</div>
        </div>
    </div>
</div>

<script>
    let currentSessionId = null;
    let allSessions = [];
    let pollTimer = null;

    // ===== Тост вместо alert =====
    let toastTimer;
    function toast(msg, color = '#ef4444') {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.style.background = color;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
    }

    // ===== Фикс клавиатуры (iOS) =====
    function setupViewportHeight() {
        const appEl = document.getElementById('appContainer');
        if (!window.visualViewport) return;
        const apply = () => {
            if (window.visualViewport.height < window.innerHeight - 100) {
                appEl.style.height = window.visualViewport.height + 'px';
            } else {
                appEl.style.height = '100dvh';
            }
        };
        window.visualViewport.addEventListener('resize', apply);
        window.visualViewport.addEventListener('scroll', apply);
    }

    // ===== Скролл вниз =====
    function scrollToBottom(force = false) {
        const box = document.getElementById('messages');
        if (!box) return;
        const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
        if (force || nearBottom) {
            requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
        }
    }

    // ===== Авторизация =====
    async function login() {
        const pass = document.getElementById('password').value;
        if (!pass) return toast('Введите пароль', '#f59e0b');
        try {
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({password: pass})
            });
            const result = await res.text();
            if (result === 'ok') startApp();
            else toast('Неверный пароль!');
        } catch(e) { toast('Ошибка соединения'); }
    }

    function startApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appContainer').style.display = 'flex';
        setupViewportHeight();
        loadSessions();
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(loadSessions, 3000);
    }

    // ===== Сайдбар =====
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('open');
    }

    // ===== Загрузка сессий =====
    async function loadSessions() {
        try {
            const res = await fetch('/api/admin/sessions');
            allSessions = await res.json();

            const list = document.getElementById('chatList');
            const countEl = document.getElementById('chatCount');
            list.innerHTML = '';

            if (!allSessions || allSessions.length === 0) {
                countEl.textContent = '0';
                list.innerHTML = '<div style="padding:20px;color:#64748b;text-align:center;">Пока нет сообщений</div>';
                return;
            }

            countEl.textContent = allSessions.length;

            allSessions.forEach(s => {
                const msgs = s.messages || [];
                const lastMsg = msgs.length > 0 ? msgs[msgs.length - 1].text : 'Нет сообщений';
                const firstLetter = (s.sessionId || '?').trim().charAt(0).toUpperCase();

                const div = document.createElement('div');
                div.className = 'chat-item'
                    + (s.sessionId === currentSessionId ? ' active' : '')
                    + (s.closed ? ' closed' : '');
                div.onclick = () => selectSession(s.sessionId);

                // Аватарка
                const av = document.createElement('div');
                av.className = 'avatar';
                av.textContent = firstLetter;

                // Инфо
                const info = document.createElement('div');
                info.className = 'chat-info';

                const idDiv = document.createElement('div');
                idDiv.className = 'id';
                idDiv.textContent = s.sessionId;
                if (s.closed) {
                    const lock = document.createElement('span');
                    lock.className = 'lock';
                    lock.textContent = '🔒';
                    idDiv.appendChild(lock);
                }

                const previewDiv = document.createElement('div');
                previewDiv.className = 'preview';
                previewDiv.textContent = lastMsg;

                info.appendChild(idDiv);
                info.appendChild(previewDiv);

                // Бейдж с количеством
                const badge = document.createElement('div');
                badge.className = 'badge-count';
                badge.textContent = msgs.length;

                div.appendChild(av);
                div.appendChild(info);
                div.appendChild(badge);
                list.appendChild(div);
            });

            if (currentSessionId) {
                const current = allSessions.find(s => s.sessionId === currentSessionId);
                if (current) renderMessages(current);
            }
        } catch(e) { console.error("Ошибка загрузки сессий", e); }
    }

    function selectSession(id) {
        currentSessionId = id;
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('overlay').classList.remove('open');

        loadSessions();
        const session = allSessions.find(s => s.sessionId === id);
        if (session) {
            renderMessages(session, true);
            const input = document.getElementById('replyInput');
            const btn = document.getElementById('replyBtn');
            input.disabled = session.closed;
            btn.disabled = session.closed;
        }
    }

    function renderMessages(session, forceScroll = false) {
        document.getElementById('chatTitle').textContent = `Диалог: ${session.sessionId}`;

        const actions = document.getElementById('chatActions');
        if (!session.closed) {
            actions.innerHTML = `<button class="btn-close" onclick="closeChat()">Закрыть</button>`;
        } else {
            actions.innerHTML = `<span class="badge-closed">Закрыт</span>`;
        }

        const box = document.getElementById('messages');
        box.innerHTML = '';

        if (!session.messages || session.messages.length === 0) {
            box.innerHTML = `<div class="empty">
                <div class="big-icon">📭</div>
                Сообщений нет
            </div>`;
        } else {
            session.messages.forEach(m => {
                const div = document.createElement('div');
                div.className = 'msg ' + (m.from === 'admin' ? 'admin' : 'user');
                div.textContent = m.text;
                box.appendChild(div);
            });
        }
        scrollToBottom(forceScroll);
    }

    async function sendReply() {
        const input = document.getElementById('replyInput');
        const text = input.value.trim();
        if (!text || !currentSessionId) return;

        input.value = '';
        input.focus();
        try {
            await fetch('/api/admin/reply', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({sessionId: currentSessionId, text})
            });
            loadSessions();
        } catch(e) { toast('Не удалось отправить'); }
    }

    async function closeChat() {
        if (!currentSessionId) return;
        if (!confirm('Закрыть диалог?')) return;
        try {
            await fetch('/api/admin/close', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({sessionId: currentSessionId})
            });
            loadSessions();
        } catch(e) { toast('Ошибка'); }
    }

    document.getElementById('replyInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); sendReply(); }
    });

    window.onload = async () => {
        try {
            const res = await fetch('/api/admin/check');
            const status = await res.text();
            if (status === 'ok') startApp();
        } catch(e) {}
    };
</script>
</body>
</html>
