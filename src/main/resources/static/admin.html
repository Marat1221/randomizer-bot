<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0a0e1a">
    <title>Chat Admin</title>
    <style>
        :root {
            --bg: #0a0e1a;
            --surface: #111a2e;
            --elevated: #17203a;
            --border: rgba(255,255,255,0.07);
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --gradient: linear-gradient(135deg, #3b82f6 0%, #6366f1 50%, #8b5cf6 100%);
            --danger: #ef4444;
            --success: #10b981;
            --r: 16px;
            --r-sm: 12px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0;
            height: 100dvh; width: 100vw;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }
        button { font-family: inherit; }

        /* ============ TOAST ============ */
        .toast {
            position: fixed; left: 50%; transform: translateX(-50%) translateY(-20px);
            top: calc(16px + env(safe-area-inset-top));
            padding: 12px 20px; border-radius: 14px;
            font-size: 14px; font-weight: 600;
            opacity: 0; pointer-events: none;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 2000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 88vw;
            display: flex; align-items: center; gap: 10px;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--danger); }
        .toast.success { background: var(--success); }
        .toast.info { background: var(--accent); background: linear-gradient(135deg, #3b82f6, #8b5cf6); }

        /* ============ LOGIN ============ */
        .login-screen {
            position: fixed; inset: 0;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(ellipse at top, #10182e 0%, #0a0e1a 60%);
            z-index: 1000;
            padding: 20px;
            overflow: hidden;
        }
        .login-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        .orb {
            position: absolute; border-radius: 50%;
            filter: blur(70px); opacity: 0.5;
            animation: float 12s ease-in-out infinite;
        }
        .orb-1 { width: 280px; height: 280px; background: #3b82f6; top: 10%; left: -10%; }
        .orb-2 { width: 320px; height: 320px; background: #8b5cf6; bottom: 5%; right: -15%; animation-delay: -4s; }
        .orb-3 { width: 200px; height: 200px; background: #06b6d4; top: 50%; left: 40%; animation-delay: -8s; opacity: 0.3; }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
        .login-card {
            position: relative;
            background: rgba(20, 28, 48, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px;
            padding: 40px 28px 32px;
            width: 100%; max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0,0,0,0.5);
        }
        .login-icon {
            width: 72px; height: 72px;
            margin: 0 auto 20px;
            background: var(--gradient);
            border-radius: 22px;
            display: flex; align-items: center; justify-content: center;
            font-size: 36px;
            box-shadow: 0 10px 30px rgba(99,102,241,0.4);
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(99,102,241,0.4); }
            50% { box-shadow: 0 10px 45px rgba(139,92,246,0.6); }
        }
        .login-card h1 {
            margin: 0 0 6px;
            font-size: 26px; font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .login-card p {
            margin: 0 0 28px;
            color: var(--text-muted);
            font-size: 14px;
        }
        .login-card input {
            width: 100%;
            padding: 15px 18px;
            background: rgba(15, 23, 42, 0.8);
            border: 1.5px solid #334155;
            border-radius: 14px;
            color: var(--text);
            font-size: 16px;
            text-align: center;
            -webkit-appearance: none;
            transition: all 0.25s;
            margin-bottom: 14px;
        }
        .login-card input:focus {
            outline: none;
            border-color: #6366f1;
            background: rgba(15, 23, 42, 1);
            box-shadow: 0 0 0 4px rgba(99,102,241,0.15);
        }
        .login-card button {
            width: 100%;
            padding: 15px;
            background: var(--gradient);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            min-height: 52px;
            box-shadow: 0 8px 24px rgba(99,102,241,0.4);
            transition: transform 0.1s;
        }
        .login-card button:active { transform: scale(0.97); }
        .login-card button:disabled { opacity: 0.7; }

        /* ============ APP / VIEWS ============ */
        .app { position: fixed; inset: 0; overflow: hidden; }

        .view {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }
        .view-list { transform: translateX(0); }
        .view-list.hidden { transform: translateX(-100%); }
        .view-chat {
            transform: translateX(100%);
            z-index: 2;
            background: var(--bg);
        }
        .view-chat.active { transform: translateX(0); }

        /* ============ LIST HEADER ============ */
        .list-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 18px;
            padding-top: calc(14px + env(safe-area-inset-top));
            background: rgba(17, 26, 46, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .list-title { display: flex; align-items: center; gap: 10px; }
        .brand-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--gradient);
            box-shadow: 0 0 12px rgba(139,92,246,0.7);
        }
        .list-header h1 {
            margin: 0; font-size: 22px; font-weight: 800;
            letter-spacing: -0.4px;
        }
        .icon-btn {
            width: 42px; height: 42px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .icon-btn:active { background: rgba(255,255,255,0.12); transform: scale(0.94); }

        /* ============ SEARCH ============ */
        .search-wrap {
            max-height: 0;
            overflow: hidden;
            padding: 0 18px;
            transition: max-height 0.3s, padding 0.3s;
            background: var(--surface);
            flex-shrink: 0;
        }
        .search-wrap.open {
            max-height: 80px;
            padding: 12px 18px;
        }
        .search-inner {
            position: relative;
            display: flex; align-items: center;
        }
        .search-inner input {
            width: 100%;
            padding: 12px 40px 12px 16px;
            background: var(--elevated);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 16px;
            -webkit-appearance: none;
        }
        .search-inner input:focus { outline: none; border-color: #6366f1; }
        .search-clear {
            position: absolute; right: 8px;
            width: 30px; height: 30px;
            background: transparent; border: none;
            color: var(--text-dim); cursor: pointer;
            border-radius: 50%;
            display: none;
            align-items: center; justify-content: center;
            font-size: 16px;
        }
        .search-clear.visible { display: flex; }
        .search-clear:active { background: rgba(255,255,255,0.1); }

        /* ============ FILTERS ============ */
        .filters {
            display: flex; gap: 8px;
            padding: 12px 18px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
        }
        .filters::-webkit-scrollbar { display: none; }
        .filter {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 14px;
            background: var(--elevated);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .filter .count {
            font-size: 11px;
            background: rgba(255,255,255,0.1);
            padding: 1px 6px;
            border-radius: 8px;
            min-width: 18px;
            text-align: center;
        }
        .filter.active {
            background: var(--gradient);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(99,102,241,0.35);
        }
        .filter.active .count { background: rgba(255,255,255,0.25); }
        .filter:active { transform: scale(0.96); }

        /* ============ CHAT LIST ============ */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .chat-item {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 18px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            cursor: pointer;
            transition: background 0.15s;
        }
        .chat-item:active { background: rgba(255,255,255,0.06); }
        .chat-item.unread .preview { color: var(--text); font-weight: 500; }
        .chat-item.unread .name { color: #fff; }
        .chat-avatar {
            position: relative;
            width: 52px; height: 52px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 700;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(0,0,0,0.3);
        }
        .chat-avatar .status-dot {
            position: absolute;
            bottom: 0; right: 0;
            width: 14px; height: 14px;
            border-radius: 50%;
            border: 2.5px solid var(--bg);
            background: var(--text-dim);
        }
        .chat-item:not(.closed) .status-dot { background: var(--success); box-shadow: 0 0 8px rgba(16,185,129,0.6); }
        .chat-avatar .unread-dot {
            position: absolute;
            top: -2px; right: -2px;
            width: 12px; height: 12px;
            border-radius: 50%;
            background: var(--danger);
            border: 2px solid var(--bg);
            display: none;
        }
        .chat-item.unread .unread-dot { display: block; }
        .chat-info { flex: 1; min-width: 0; }
        .chat-info .row1 {
            display: flex; justify-content: space-between; align-items: baseline;
            gap: 8px;
        }
        .chat-info .name {
            font-size: 15px; font-weight: 600;
            color: var(--text-muted);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            display: flex; align-items: center; gap: 6px;
        }
        .chat-info .name .lock { color: var(--text-dim); flex-shrink: 0; }
        .chat-info .badge {
            font-size: 11px; font-weight: 700;
            background: rgba(255,255,255,0.08);
            color: var(--text-muted);
            padding: 2px 7px;
            border-radius: 8px;
            flex-shrink: 0;
        }
        .chat-item.unread .badge {
            background: var(--danger);
            color: #fff;
        }
        .chat-info .preview {
            margin-top: 3px;
            font-size: 13px;
            color: var(--text-dim);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .chat-item.closed { opacity: 0.55; }

        .loading, .empty-list {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-dim);
            font-size: 14px;
        }
        .empty-list svg { width: 60px; height: 60px; opacity: 0.4; margin-bottom: 14px; }

        /* ============ CHAT VIEW ============ */
        .chat-header {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px;
            padding-top: calc(10px + env(safe-area-inset-top));
            background: rgba(17, 26, 46, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            min-height: 60px;
        }
        .back-btn { width: 40px; height: 40px; }
        .chat-header-info {
            display: flex; align-items: center; gap: 10px;
            flex: 1; min-width: 0;
        }
        .chat-header-avatar {
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }
        .chat-header-text { min-width: 0; flex: 1; }
        .chat-header-name {
            font-size: 15px; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .chat-header-status {
            font-size: 12px;
            color: var(--text-muted);
            display: flex; align-items: center; gap: 5px;
        }
        .chat-header-status .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--success);
        }
        .chat-header-status.closed .dot { background: var(--text-dim); }

        .close-chat-btn {
            padding: 8px 14px;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.4);
            color: #fca5a5;
            border-radius: 10px;
            font-size: 13px; font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            min-height: 36px;
        }
        .close-chat-btn:active { background: var(--danger); color: #fff; }

        .messages {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding: 16px 14px;
            display: flex; flex-direction: column; gap: 8px;
            min-height: 0;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .msg {
            padding: 10px 14px;
            border-radius: 18px;
            max-width: 82%;
            font-size: 15px;
            line-height: 1.45;
            word-break: break-word;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
            min-width: 0;
            animation: msgIn 0.25s ease;
        }
        .msg.user {
            align-self: flex-start;
            background: linear-gradient(135deg, #1e293b, #1a2438);
            border: 1px solid rgba(255,255,255,0.06);
            border-bottom-left-radius: 6px;
        }
        .msg.admin {
            align-self: flex-end;
            background: var(--gradient);
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 14px rgba(99,102,241,0.28);
        }

        .empty {
            margin: auto;
            text-align: center;
            color: var(--text-dim);
            padding: 30px 20px;
        }
        .empty svg { width: 64px; height: 64px; opacity: 0.35; margin-bottom: 16px; }
        .empty p { margin: 0; font-size: 14px; line-height: 1.6; }

        /* ============ INPUT ============ */
        .input-area {
            padding: 10px 12px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border);
            display: flex; gap: 8px; align-items: flex-end;
            background: rgba(17, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            padding: 13px 18px;
            border-radius: 24px;
            border: 1.5px solid #334155;
            background: var(--elevated);
            color: var(--text);
            font-size: 16px;
            outline: none;
            min-width: 0;
            -webkit-appearance: none;
            transition: border-color 0.2s;
        }
        .input-area input:focus { border-color: #6366f1; }
        .input-area button {
            width: 48px; height: 48px;
            background: var(--gradient);
            border: none;
            color: #fff;
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 14px rgba(99,102,241,0.4);
            transition: transform 0.1s, opacity 0.2s;
            padding: 0;
        }
        .input-area button:active:not(:disabled) { transform: scale(0.9); }
        .input-area button:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ============ LOGIN ============ -->
<div class="login-screen" id="loginScreen">
    <div class="login-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="login-card">
        <div class="login-icon">💬</div>
        <h1>Chat Admin</h1>
        <p>Вход в панель управления</p>
        <input type="password" id="password" placeholder="Пароль" autocomplete="current-password"
               onkeypress="if(event.key==='Enter') login()">
        <button onclick="login()" id="loginBtn">Войти</button>
    </div>
</div>

<!-- ============ APP ============ -->
<div class="app" id="app" style="display:none">

    <!-- === LIST VIEW === -->
    <div class="view view-list" id="viewList">
        <header class="list-header">
            <div class="list-title">
                <span class="brand-dot"></span>
                <h1>Диалоги</h1>
            </div>
            <button class="icon-btn" onclick="toggleSearch()" aria-label="Поиск">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </button>
        </header>

        <div class="search-wrap" id="searchWrap">
            <div class="search-inner">
                <input type="search" id="searchInput" placeholder="Поиск по диалогам..."
                       oninput="onSearch(this.value)">
                <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
            </div>
        </div>

        <div class="filters">
            <button class="filter active" data-filter="all" onclick="setFilter('all')">
                Все <span class="count" id="cAll">0</span>
            </button>
            <button class="filter" data-filter="active" onclick="setFilter('active')">
                Активные <span class="count" id="cActive">0</span>
            </button>
            <button class="filter" data-filter="closed" onclick="setFilter('closed')">
                Закрытые <span class="count" id="cClosed">0</span>
            </button>
        </div>

        <div class="chat-list" id="chatList">
            <div class="loading">Загрузка...</div>
        </div>
    </div>

    <!-- === CHAT VIEW === -->
    <div class="view view-chat" id="viewChat">
        <header class="chat-header">
            <button class="icon-btn back-btn" onclick="goBack()" aria-label="Назад">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </button>
            <div class="chat-header-info">
                <div class="chat-header-avatar" id="chatHeaderAvatar">?</div>
                <div class="chat-header-text">
                    <div class="chat-header-name" id="chatHeaderName">Диалог</div>
                    <div class="chat-header-status" id="chatHeaderStatus">
                        <span class="dot"></span><span id="chatHeaderStatusText">Активен</span>
                    </div>
                </div>
            </div>
            <div id="chatHeaderAction"></div>
        </header>

        <div class="messages" id="messages">
            <div class="empty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <p>Выберите диалог из списка,<br>чтобы начать переписку</p>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="replyInput" placeholder="Написать сообщение..."
                   disabled enterkeyhint="send" autocomplete="off">
            <button id="replyBtn" disabled onclick="sendReply()" aria-label="Отправить">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<script>
    // ========== STATE ==========
    let currentSessionId = null;
    let allSessions = [];
    let filteredSessions = [];
    let currentFilter = 'all';
    let searchQuery = '';
    let seenCounts = {};
    let pollTimer = null;
    let firstLoadDone = false;

    // ========== UTILS ==========
    const AVATAR_GRADIENTS = [
        'linear-gradient(135deg, #3b82f6, #8b5cf6)',
        'linear-gradient(135deg, #ec4899, #f43f5e)',
        'linear-gradient(135deg, #f59e0b, #ef4444)',
        'linear-gradient(135deg, #10b981, #06b6d4)',
        'linear-gradient(135deg, #8b5cf6, #ec4899)',
        'linear-gradient(135deg, #06b6d4, #3b82f6)',
        'linear-gradient(135deg, #f97316, #f59e0b)',
        'linear-gradient(135deg, #14b8a6, #10b981)',
    ];

    function getGradient(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
        return AVATAR_GRADIENTS[Math.abs(hash) % AVATAR_GRADIENTS.length];
    }

    let toastTimer;
    function toast(msg, type = 'error') {
        const el = document.getElementById('toast');
        const icons = { error: '✕', success: '✓', info: 'ℹ' };
        el.className = 'toast ' + type;
        el.innerHTML = `<span>${icons[type] || ''}</span><span>${msg}</span>`;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    function setupViewport() {
        const app = document.getElementById('app');
        if (!window.visualViewport) return;
        const apply = () => {
            if (window.visualViewport.height < window.innerHeight - 100) {
                app.style.height = window.visualViewport.height + 'px';
            } else {
                app.style.height = '100dvh';
            }
        };
        window.visualViewport.addEventListener('resize', apply);
        window.visualViewport.addEventListener('scroll', apply);
    }

    // ========== AUTH ==========
    async function login() {
        const pass = document.getElementById('password').value;
        if (!pass) return toast('Введите пароль', 'error');
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        try {
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({password: pass})
            });
            const text = await res.text();
            if (text === 'ok') {
                startApp();
            } else {
                toast('Неверный пароль', 'error');
                btn.disabled = false;
            }
        } catch(e) {
            toast('Ошибка соединения', 'error');
            btn.disabled = false;
        }
    }

    function startApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        setupViewport();
        loadSessions();
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(loadSessions, 3000);
    }

    // ========== DATA ==========
    async function loadSessions() {
        try {
            const res = await fetch('/api/admin/sessions');
            const data = await res.json();
            allSessions = Array.isArray(data) ? data : [];

            if (!firstLoadDone) {
                // На первой загрузке помечаем всё как прочитанное,
                // чтобы не спамить бейджами старые чаты
                allSessions.forEach(s => {
                    seenCounts[s.sessionId] = (s.messages || []).length;
                });
                firstLoadDone = true;
            }

            updateCounts();
            applyFilterAndSearch();

            if (currentSessionId) {
                const current = allSessions.find(s => s.sessionId === currentSessionId);
                if (current) {
                    renderMessages(current);
                    updateChatHeader(current);
                } else {
                    // Сессия исчезла (например, удалена)
                    goBack();
                }
            }
        } catch(e) {
            console.error('Ошибка загрузки сессий', e);
        }
    }

    function needsReply(s) {
        if (s.closed) return false;
        const msgs = s.messages || [];
        if (msgs.length === 0) return false;
        return msgs[msgs.length - 1].from !== 'admin';
    }

    function isUnread(s) {
        const count = (s.messages || []).length;
        const seen = seenCounts[s.sessionId] || 0;
        return count > seen && s.sessionId !== currentSessionId;
    }

    // ========== FILTERS & SEARCH ==========
    function updateCounts() {
        const total = allSessions.length;
        const active = allSessions.filter(s => !s.closed).length;
        const closed = allSessions.filter(s => s.closed).length;
        document.getElementById('cAll').textContent = total;
        document.getElementById('cActive').textContent = active;
        document.getElementById('cClosed').textContent = closed;
    }

    function setFilter(f) {
        currentFilter = f;
        document.querySelectorAll('.filter').forEach(b => {
            b.classList.toggle('active', b.dataset.filter === f);
        });
        applyFilterAndSearch();
    }

    function toggleSearch() {
        const wrap = document.getElementById('searchWrap');
        wrap.classList.toggle('open');
        if (wrap.classList.contains('open')) {
            setTimeout(() => document.getElementById('searchInput').focus(), 250);
        } else {
            clearSearch();
        }
    }

    function onSearch(val) {
        searchQuery = val.trim().toLowerCase();
        document.getElementById('searchClear').classList.toggle('visible', searchQuery.length > 0);
        applyFilterAndSearch();
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        searchQuery = '';
        document.getElementById('searchClear').classList.remove('visible');
        applyFilterAndSearch();
    }

    function applyFilterAndSearch() {
        filteredSessions = allSessions.filter(s => {
            if (currentFilter === 'active' && s.closed) return false;
            if (currentFilter === 'closed' && !s.closed) return false;
            if (searchQuery) {
                const id = (s.sessionId || '').toLowerCase();
                const msgs = s.messages || [];
                const lastText = msgs.length ? (msgs[msgs.length - 1].text || '').toLowerCase() : '';
                if (!id.includes(searchQuery) && !lastText.includes(searchQuery)) return false;
            }
            return true;
        });
        renderChatList();
    }

    // ========== LIST RENDER ==========
    function renderChatList() {
        const list = document.getElementById('chatList');
        list.innerHTML = '';

        if (filteredSessions.length === 0) {
            const msg = searchQuery
                ? 'Ничего не найдено'
                : (currentFilter === 'closed' ? 'Нет закрытых диалогов'
                    : currentFilter === 'active' ? 'Нет активных диалогов'
                        : 'Пока нет ни одного диалога');
            list.innerHTML = `
            <div class="empty-list">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <div>${msg}</div>
            </div>`;
            return;
        }

        filteredSessions.forEach(s => {
            const msgs = s.messages || [];
            const last = msgs[msgs.length - 1];
            const lastText = last ? last.text : 'Нет сообщений';
            const needsR = needsReply(s);
            const unread = isUnread(s);
            const letter = (s.sessionId || '?').trim().charAt(0).toUpperCase();
            const gradient = getGradient(s.sessionId || '');

            const el = document.createElement('div');
            el.className = 'chat-item'
                + (s.sessionId === currentSessionId ? ' active' : '')
                + (s.closed ? ' closed' : '')
                + (needsR || unread ? ' unread' : '');
            el.onclick = () => openChat(s.sessionId);

            // Аватарка
            const av = document.createElement('div');
            av.className = 'chat-avatar';
            av.style.background = s.closed ? 'linear-gradient(135deg,#475569,#334155)' : gradient;
            av.textContent = letter;
            if (s.closed) {
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                av.appendChild(dot);
            } else {
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                av.appendChild(dot);
                if (needsR || unread) {
                    const ud = document.createElement('span');
                    ud.className = 'unread-dot';
                    av.appendChild(ud);
                }
            }

            // Инфо
            const info = document.createElement('div');
            info.className = 'chat-info';

            const row1 = document.createElement('div');
            row1.className = 'row1';

            const name = document.createElement('div');
            name.className = 'name';
            name.textContent = s.sessionId;
            if (s.closed) {
                const lock = document.createElement('span');
                lock.className = 'lock';
                lock.innerHTML = '🔒';
                name.appendChild(lock);
            }

            const badge = document.createElement('div');
            badge.className = 'badge';
            badge.textContent = msgs.length;

            row1.appendChild(name);
            row1.appendChild(badge);

            const preview = document.createElement('div');
            preview.className = 'preview';
            preview.textContent = (last && last.from === 'admin' ? 'Вы: ' : '') + lastText;

            info.appendChild(row1);
            info.appendChild(preview);

            el.appendChild(av);
            el.appendChild(info);
            list.appendChild(el);
        });
    }

    // ========== CHAT VIEW ==========
    function openChat(id) {
        currentSessionId = id;
        const session = allSessions.find(s => s.sessionId === id);
        if (!session) return;

        // Помечаем как прочитанное
        seenCounts[id] = (session.messages || []).length;

        // Переключаем вид
        document.getElementById('viewChat').classList.add('active');
        document.getElementById('viewList').classList.add('hidden');

        renderMessages(session, true);
        updateChatHeader(session);

        const input = document.getElementById('replyInput');
        const btn = document.getElementById('replyBtn');
        input.disabled = !!session.closed;
        btn.disabled = !!session.closed;
        if (!session.closed) {
            setTimeout(() => input.focus(), 350);
        }

        // Обновляем список (снимаем unread)
        renderChatList();
    }

    function goBack() {
        currentSessionId = null;
        document.getElementById('viewChat').classList.remove('active');
        document.getElementById('viewList').classList.remove('hidden');
        document.getElementById('replyInput').value = '';
        document.getElementById('replyInput').blur();
        renderChatList();
    }

    function updateChatHeader(session) {
        const letter = (session.sessionId || '?').trim().charAt(0).toUpperCase();
        const av = document.getElementById('chatHeaderAvatar');
        av.textContent = letter;
        av.style.background = session.closed
            ? 'linear-gradient(135deg,#475569,#334155)'
            : getGradient(session.sessionId || '');

        document.getElementById('chatHeaderName').textContent = session.sessionId;

        const status = document.getElementById('chatHeaderStatus');
        const statusText = document.getElementById('chatHeaderStatusText');
        if (session.closed) {
            status.classList.add('closed');
            statusText.textContent = 'Закрыт';
        } else {
            status.classList.remove('closed');
            statusText.textContent = 'Активен';
        }

        const action = document.getElementById('chatHeaderAction');
        if (!session.closed) {
            action.innerHTML = `<button class="close-chat-btn" onclick="closeChat()">Закрыть</button>`;
        } else {
            action.innerHTML = '';
        }
    }

    function renderMessages(session, forceScroll = false) {
        const box = document.getElementById('messages');
        const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;

        box.innerHTML = '';

        if (!session.messages || session.messages.length === 0) {
            box.innerHTML = `
            <div class="empty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <p>В этом диалоге пока нет сообщений</p>
            </div>`;
            return;
        }

        session.messages.forEach(m => {
            const div = document.createElement('div');
            div.className = 'msg ' + (m.from === 'admin' ? 'admin' : 'user');
            div.textContent = m.text;
            box.appendChild(div);
        });

        if (forceScroll || nearBottom) {
            requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
        }
    }

    async function sendReply() {
        const input = document.getElementById('replyInput');
        const text = input.value.trim();
        if (!text || !currentSessionId) return;

        input.value = '';
        input.focus();
        try {
            await fetch('/api/admin/reply', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({sessionId: currentSessionId, text})
            });
            loadSessions();
        } catch(e) {
            toast('Не удалось отправить', 'error');
        }
    }

    async function closeChat() {
        if (!currentSessionId) return;
        if (!confirm('Закрыть этот диалог?')) return;
        try {
            await fetch('/api/admin/close', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({sessionId: currentSessionId})
            });
            toast('Диалог закрыт', 'success');
            loadSessions();
        } catch(e) {
            toast('Ошибка', 'error');
        }
    }

    // ========== EVENTS ==========
    document.getElementById('replyInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); sendReply(); }
    });

    // Swipe-back gesture (от левого края вправо)
    (function() {
        let startX = 0, startY = 0, tracking = false;
        const chatView = document.getElementById('viewChat');
        chatView.addEventListener('touchstart', (e) => {
            if (!chatView.classList.contains('active')) return;
            const t = e.touches[0];
            if (t.clientX < 40) {
                startX = t.clientX;
                startY = t.clientY;
                tracking = true;
            }
        }, { passive: true });
        chatView.addEventListener('touchmove', (e) => {
            if (!tracking) return;
            const t = e.touches[0];
            const dx = t.clientX - startX;
            const dy = t.clientY - startY;
            if (Math.abs(dy) > Math.abs(dx) * 1.5) tracking = false;
        }, { passive: true });
        chatView.addEventListener('touchend', (e) => {
            if (!tracking) return;
            const t = e.changedTouches[0];
            const dx = t.clientX - startX;
            const dy = t.clientY - startY;
            if (dx > 80 && Math.abs(dy) < 100) goBack();
            tracking = false;
        }, { passive: true });
    })();

    // ========== INIT ==========
    window.onload = async () => {
        try {
            const res = await fetch('/api/admin/check');
            const status = await res.text();
            if (status === 'ok') startApp();
        } catch(e) {}
    };
</script>
</body>
</html>
