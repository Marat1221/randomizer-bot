<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Дни рождения — Счётчики событий</title>
  <meta name="description" content="Счётчики обратного отсчёта до дней рождения. Выберите человека и узнайте, сколько дней осталось.">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; min-height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; }
    body {
      display: flex; flex-direction: column;
      background: linear-gradient(-45deg, #2a0845, #1a1a3e, #4a1e2a, #0a1428);
      background-size: 400% 400%;
      animation: gradientBG 18s ease infinite;
      color: #fff; overflow-x: hidden;
    }
    @keyframes gradientBG { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

    .bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; z-index: 0; }
    .orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.5; will-change: transform; }
    .orb-1 { width: 350px; height: 350px; top: -10%; left: -10%; background: radial-gradient(circle, #ff3b5c, transparent 70%); animation: float1 20s ease-in-out infinite; }
    .orb-2 { width: 400px; height: 400px; bottom: -15%; right: -10%; background: radial-gradient(circle, #b83bff, transparent 70%); animation: float2 25s ease-in-out infinite; }
    .orb-3 { width: 300px; height: 300px; top: 40%; right: 30%; background: radial-gradient(circle, #ffd23f, transparent 70%); animation: float3 22s ease-in-out infinite; opacity: 0.3; }
    @keyframes float1 { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(80px,60px) scale(1.2); } }
    @keyframes float2 { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-100px,-80px) scale(1.15); } }
    @keyframes float3 { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-60px,100px) scale(1.1); } }

    .topbar {
      position: relative; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      background: rgba(10, 20, 40, 0.4);
    }
    .back-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 18px; border-radius: 12px;
      background: rgba(10, 20, 40, 0.8); border: 1px solid rgba(255, 59, 92, 0.5);
      color: #ff6b8a; text-decoration: none; font-size: 15px; font-weight: 600;
      transition: all 0.3s;
    }
    .back-btn:hover { background: rgba(74, 30, 42, 0.9); transform: translateX(-5px); box-shadow: 0 0 20px rgba(255, 59, 92, 0.5); }
    .logo { color: #fff; font-weight: 700; font-size: 18px; letter-spacing: 1px; }

    main { position: relative; z-index: 10; padding: 50px 40px 80px; flex: 1; }
    .hero { text-align: center; margin-bottom: 50px; }
    .hero h1 {
      font-size: 52px; font-weight: 200; letter-spacing: 6px;
      margin: 0 0 15px; text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 59, 92, 0.8), 0 0 50px rgba(255, 59, 92, 0.4);
    }
    .hero p { color: #94a3b8; font-size: 16px; margin: 0; letter-spacing: 1px; }

    .hub-container { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; }
    .hub-card {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 240px; height: 280px; border-radius: 24px;
      text-decoration: none; transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative; overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 59, 92, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .hub-card::before {
      content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: skewX(-20deg); transition: 0.7s;
    }
    .hub-card:hover::before { left: 150%; }
    .hub-card:hover { transform: translateY(-12px) scale(1.04); box-shadow: 0 25px 50px rgba(0,0,0,0.6), 0 0 40px rgba(255, 59, 92, 0.6); border-color: #ff3b5c; }
    .hub-icon { font-size: 76px; margin-bottom: 20px; filter: drop-shadow(0 0 20px #ff3b5c); transition: transform 0.4s; }
    .hub-card:hover .hub-icon { transform: scale(1.15) rotate(-5deg); }
    .hub-title { color: #fff; font-size: 20px; font-weight: 600; letter-spacing: 1.5px; }
    .hub-date { color: #64748b; font-size: 13px; margin-top: 8px; letter-spacing: 1px; }

    .empty-state {
      text-align: center; color: #64748b; padding: 60px 20px;
      background: rgba(255,255,255,0.03);
      border: 1px dashed rgba(255,255,255,0.1);
      border-radius: 20px;
      max-width: 400px; margin: 0 auto;
    }

    .footer {
      position: relative; z-index: 10;
      padding: 30px 40px;
      border-top: 1px solid rgba(255,255,255,0.08);
      background: rgba(10, 20, 40, 0.4);
      backdrop-filter: blur(10px);
      text-align: center; color: #64748b; font-size: 13px;
    }

    @media (max-width: 768px) {
      .topbar { padding: 15px 20px; }
      .logo { font-size: 15px; }
      .back-btn { padding: 8px 14px; font-size: 13px; }
      main { padding: 30px 20px 60px; }
      .hero h1 { font-size: 28px; letter-spacing: 4px; }
      .hero p { font-size: 13px; }
      .hub-container { flex-direction: column; gap: 15px; align-items: center; }
      .hub-card { width: 100%; max-width: 320px; height: 95px; flex-direction: row; justify-content: flex-start; padding-left: 25px; border-radius: 16px; }
      .hub-icon { font-size: 42px; margin-bottom: 0; margin-right: 20px; }
      .hub-title { font-size: 17px; }
      .hub-date { position: absolute; bottom: 15px; right: 20px; margin: 0; font-size: 11px; }
    }
  </style>
</head>
<body>

<div class="bg-layer">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<header class="topbar">
  <a href="/" class="back-btn">← На главную</a>
  <div class="logo">🎂 Дни рождения</div>
</header>

<main>
  <div class="hero">
    <h1>Дни рождения</h1>
    <p>Выберите человека, чтобы увидеть счётчик</p>
  </div>

  <div class="hub-container" id="birthdays-list"></div>
</main>

<footer class="footer">© <span id="current-year">2026</span> Марат | Countdown Hub</footer>

<script>
  document.getElementById('current-year').textContent = new Date().getFullYear();

  // ⚠️ ЗДЕСЬ СПИСОК ЛЮДЕЙ. Чтобы добавить нового — просто добавь строку и создай файл имя.html
  const birthdays = [
    { id: 'adina', name: 'Адина', icon: '🎂', date: '30 августа' }
  ];

  const container = document.getElementById('birthdays-list');

  if (birthdays.length === 0) {
    container.innerHTML = '<div class="empty-state">Пока никого нет 😢</div>';
  } else {
    birthdays.forEach(person => {
      const card = document.createElement('a');
      card.href = '/' + person.id + '.html';
      card.className = 'hub-card';
      card.innerHTML = `
                    <div class="hub-icon">${person.icon}</div>
                    <div class="hub-title">${person.name}</div>
                    <div class="hub-date">${person.date}</div>
                `;
      container.appendChild(card);
    });
  }
</script>
</body>
</html>
