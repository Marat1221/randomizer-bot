  } else {
    birthdays.forEach(person => {
      const card = document.createElement('a');
      // Ссылка ведет на страницу, например /myrzaiym.html

        <div class="avatar-circle">${person.icon}</div>
        <div class="hub-title">${person.name}</div>
        <div class="hub-date">${person.date}</div>
      `;
      container.appendChild(card);
    });
