<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новогодний Неоновый Отсчет</title>
    <style>
        :root {
            --digit-w: 48px;
            --digit-h: 76px;
            --digit-font: 60px;
            --pad: 10px 20px;
            --gap: 30px;
            --title-size: 26px;
            --title-spacing: 5px;
            --label-size: 11px;
            --label-spacing: 3px;
        }

        /* Глубокий черно-угольный фон */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #050b14 0%, #000205 100%);
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Эффект старого монитора (сканирующие линии) */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
            linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* Заголовок с легким мерцанием */
        h1 {
            color: #ffffff;
            margin-bottom: 40px;
            font-size: var(--title-size);
            font-weight: 300;
            letter-spacing: var(--title-spacing);
            text-transform: uppercase;
            z-index: 2;
            text-align: center;
            padding: 0 12px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6), 0 0 20px rgba(0, 242, 254, 0.3);
            animation: textFlicker 5s infinite alternate;
        }

        @keyframes textFlicker {
            0%, 100% { opacity: 1; }
            95% { opacity: 1; }
            96% { opacity: 0.8; }
            97% { opacity: 1; }
            98% { opacity: 0.9; }
            99% { opacity: 1; }
        }

        .clock-wrapper {
            display: flex;
            gap: var(--gap);
            z-index: 2;
            margin-bottom: 50px;
            justify-content: center;
            align-items: flex-start;
        }

        .time-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-label {
            color: #64748b;
            font-size: var(--label-size);
            text-transform: uppercase;
            letter-spacing: var(--label-spacing);
            margin-top: 14px;
            font-weight: 600;
        }

        /* Черно-неоновые рамки */
        .counter-container {
            display: flex;
            padding: var(--pad);
            background: linear-gradient(145deg, #0a0f1d, #030712);
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 15px rgba(127, 0, 255, 0.25);
            border: 1px solid rgba(127, 0, 255, 0.4);
        }

        /* Окошки для светящихся бирюзовых цифр */
        .digit-box {
            position: relative;
            width: var(--digit-w);
            height: var(--digit-h);
            overflow: hidden;
            font-size: var(--digit-font);
            font-weight: 700;
            color: #00f2fe;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.8), 0 0 20px rgba(0, 242, 254, 0.4);
            font-family: 'Courier New', Courier, monospace;
        }

        .digit-tape {
            position: absolute;
            top: 0; left: 0;
            display: flex;
            flex-direction: column;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .digit {
            width: var(--digit-w);
            height: var(--digit-h);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер для неоновой рекламы */
        .ad-container {
            z-index: 5;
            width: 400px;
            min-height: 80px;
            background: #02040a;
            border: 1px dashed #ff007f;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.15), inset 0 0 10px rgba(255, 0, 127, 0.05);
            transition: all 0.3s ease;
            text-decoration: none;
            overflow: hidden;
        }

        .ad-container:hover {
            border-style: solid;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.4), inset 0 0 15px rgba(255, 0, 127, 0.1);
        }

        .ad-text {
            color: #ff007f;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
            text-align: center;
            line-height: 1.5;
        }

        /* Холст неонового снега */
        #snow-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* ===== МОБИЛЬНАЯ АДАПТАЦИЯ ===== */

        /* Средние телефоны и планшеты */
        @media (max-width: 640px) {
            :root {
                --digit-w: 32px;
                --digit-h: 50px;
                --digit-font: 40px;
                --pad: 6px 12px;
                --gap: 12px;
                --title-size: 16px;
                --title-spacing: 3px;
                --label-size: 9px;
                --label-spacing: 2px;
            }
            h1 { margin-bottom: 24px; }
            .clock-wrapper { margin-bottom: 30px; }
            .time-label { margin-top: 8px; }
            .counter-container { border-radius: 10px; }
            .ad-container { width: 90% !important; max-width: 320px; }
        }

        /* Маленькие телефоны */
        @media (max-width: 400px) {
            :root {
                --digit-w: 26px;
                --digit-h: 42px;
                --digit-font: 32px;
                --pad: 4px 8px;
                --gap: 8px;
                --title-size: 14px;
                --title-spacing: 2px;
                --label-size: 8px;
                --label-spacing: 1px;
            }
            h1 { margin-bottom: 20px; }
            .clock-wrapper { margin-bottom: 24px; }
        }

        /* Очень узкие экраны — например, старые Android */
        @media (max-width: 340px) {
            :root {
                --digit-w: 22px;
                --digit-h: 36px;
                --digit-font: 26px;
                --pad: 3px 6px;
                --gap: 6px;
            }
        }
    </style>
    <!-- Yandex.RTB -->
    <script>window.yaContextCb=window.yaContextCb||[]</script>
    <script src="https://yandex.ru/ads/system/context.js" async></script>
</head>
<body>

<!-- Холст для рисования снега -->
<canvas id="snow-canvas"></canvas>

<h1 id="main-title">До Нового Года осталось</h1>

<div class="clock-wrapper">
    <!-- Дни -->
    <div class="time-group">
        <div class="counter-container">
            <div class="digit-box"><div class="digit-tape" id="d-hundreds"></div></div>
            <div class="digit-box"><div class="digit-tape" id="d-tens"></div></div>
            <div class="digit-box"><div class="digit-tape" id="d-ones"></div></div>
        </div>
        <div class="time-label">Дней</div>
    </div>
    <!-- Часы -->
    <div class="time-group">
        <div class="counter-container">
            <div class="digit-box"><div class="digit-tape" id="h-tens"></div></div>
            <div class="digit-box"><div class="digit-tape" id="h-ones"></div></div>
        </div>
        <div class="time-label">Часов</div>
    </div>
    <!-- Минуты -->
    <div class="time-group">
        <div class="counter-container">
            <div class="digit-box"><div class="digit-tape" id="m-tens"></div></div>
            <div class="digit-box"><div class="digit-tape" id="m-ones"></div></div>
        </div>
        <div class="time-label">Минут</div>
    </div>
    <!-- Секунды -->
    <div class="time-group">
        <div class="counter-container">
            <div class="digit-box"><div class="digit-tape" id="s-tens"></div></div>
            <div class="digit-box"><div class="digit-tape" id="s-ones"></div></div>
        </div>
        <div class="time-label">Секунды</div>
    </div>
</div>

<!-- Рекламный баннер -->
<div class="ad-container" id="ad-block">
    <!-- Yandex.RTB R-A-20278304-1 -->
    <div id="yandex_rtb_R-A-20278304-1"></div>
    <script>
        window.yaContextCb.push(() => {
            Ya.Context.AdvManager.render({
                "blockId": "R-A-20278304-1",
                "renderTo": "yandex_rtb_R-A-20278304-1"
            })
        })
    </script>
</div>

<script>
    // Высота цифры теперь берётся из CSS (--digit-h) через offsetHeight.
    // Это нужно, чтобы на мобильных (где цифры меньше) лента прокручивалась корректно.
    let digitHeight = 76;
    let timeOffset = 0;

    // Наполнение вертикальных лент цифрами от 0 до 9
    const tapes = ['d-hundreds', 'd-tens', 'd-ones', 'h-tens', 'h-ones', 'm-tens', 'm-ones', 's-tens', 's-ones'];
    tapes.forEach(id => {
        const el = document.getElementById(id);
        for (let i = 0; i <= 9; i++) {
            const div = document.createElement('div');
            div.className = 'digit';
            div.innerText = i;
            el.appendChild(div);
        }
    });

    // Пересчёт высоты цифры при загрузке и ресайзе (поворот экрана, смена размера окна)
    function recalcDigitHeight() {
        const sample = document.querySelector('.digit-box');
        if (sample) {
            digitHeight = sample.offsetHeight;
        }
    }
    recalcDigitHeight();
    window.addEventListener('resize', recalcDigitHeight);

    // Функция сдвига ленты к нужной цифре
    function moveTape(tapeId, value) {
        const tape = document.getElementById(tapeId);
        if (tape) tape.style.transform = `translateY(-${value * digitHeight}px)`;
    }

    // Обновление всех табло на экране
    function updateDisplay(days, hours, minutes, seconds) {
        moveTape('d-hundreds', Math.floor(days / 100));
        moveTape('d-tens', Math.floor((days % 100) / 10));
        moveTape('d-ones', days % 10);
        moveTape('h-tens', Math.floor(hours / 10));
        moveTape('h-ones', hours % 10);
        moveTape('m-tens', Math.floor(minutes / 10));
        moveTape('m-ones', minutes % 10);
        moveTape('s-tens', Math.floor(seconds / 10));
        moveTape('s-ones', seconds % 10);
    }

    // Вычисление оставшегося времени до 1 января
    function calculateCountdown() {
        const now = new Date(Date.now() + timeOffset);
        const currentYear = now.getFullYear();
        const nextNewYear = new Date(currentYear + 1, 0, 1, 0, 0, 0);
        const diff = nextNewYear - now;

        if (diff <= 0) {
            document.getElementById('main-title').innerText = "HAPPY NEW YEAR! 🎄";
            updateDisplay(0, 0, 0, 0);
            return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / 1000 / 60) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        updateDisplay(days, hours, minutes, seconds);
    }

    // Логика отрисовки неонового снегопада через HTML5 Canvas
    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');
    let flakes = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Создаем массив снежинок со случайными параметрами
    for (let i = 0; i < 60; i++) {
        flakes.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 2 + 1,
            d: Math.random() * 1
        });
    }

    // Цикл рисования анимации
    function drawSnow() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(0, 242, 254, 0.4)';
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#00f2fe';
        ctx.beginPath();
        for (let i = 0; i < flakes.length; i++) {
            const f = flakes[i];
            ctx.moveTo(f.x, f.y);
            ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
            f.y += Math.cos(f.d) + 1 + f.r / 2;
            f.x += Math.sin(f.d) * 0.5;
            // Перенос снежинки наверх, если она улетела за экран
            if (f.y > canvas.height) {
                flakes[i] = { x: Math.random() * canvas.width, y: 0, r: f.r, d: f.d };
            }
        }
        ctx.fill();
        ctx.shadowBlur = 0;
        requestAnimationFrame(drawSnow);
    }
    drawSnow();

    // Запрос точного времени со Spring Boot для корректировки пинга
    async function syncTime() {
        try {
            const startTime = Date.now();
            const response = await fetch('/api/value');
            if (response.ok) {
                const serverTime = await response.json();
                timeOffset = (serverTime + (Date.now() - startTime) / 2) - Date.now();
            }
        } catch (e) {}
    }

    // При повороте/ресайзе — пересчитываем высоту и сразу перерисовываем цифры
    window.addEventListener('resize', () => {
        recalcDigitHeight();
        calculateCountdown();
    });

    // Старт системы
    async function init() {
        await syncTime();
        calculateCountdown();
        setInterval(calculateCountdown, 1000);
        setInterval(syncTime, 60000);
    }
    init();
</script>
</body>
</html>
