<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новогодний Неоновый Отсчет</title>
    <style>
        /* Глубокий черно-угольный фон с неоновыми масляными переливами */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #050b14 0%, #000205 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Живой неоновый дым/масло на заднем плане */
        body::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle at 20% 30%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
            radial-gradient(circle at 80% 70%, rgba(127, 0, 255, 0.08) 0%, transparent 40%);
            animation: oilPulse 12s ease-in-out infinite alternate;
            z-index: 1;
        }

        @keyframes oilPulse {
            0% { transform: translate(-5%, -5%) rotate(0deg); }
            100% { transform: translate(5%, 5%) rotate(10deg); }
        }

        /* Заголовок со стильным неоновым свечением */
        h1 {
            color: #ffffff;
            margin-bottom: 40px;
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            z-index: 2;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6),
            0 0 20px rgba(0, 242, 254, 0.3);
        }

        /* Сетка для блоков времени */
        .clock-wrapper {
            display: flex;
            gap: 30px;
            z-index: 2;
        }

        .time-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Подписи под разрядами (Дни, Часы...) */
        .time-label {
            color: #64748b;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 14px;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        /* Черно-неоновые контейнеры (Рамки) */
        .counter-container {
            display: flex;
            padding: 10px 20px;
            background: linear-gradient(145px, #0a0f1d, #030712);
            border-radius: 16px;
            /* Внешнее неоновое свечение рамки + внутренний объем */
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9),
            0 0 15px rgba(127, 0, 255, 0.25),
            inset 0 1px 1px rgba(255, 255, 255, 0.05);
            /* Тонкий неоновый контур */
            border: 1px solid rgba(127, 0, 255, 0.4);
            position: relative;
        }

        /* Подсветка ламп (эффект неоновой матрицы внутри рамки) */
        .counter-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 16px;
            background: radial-gradient(circle at center, transparent 60%, rgba(0, 242, 254, 0.03) 100%);
            pointer-events: none;
        }

        /* Окошко для цифры */
        .digit-box {
            position: relative;
            width: 48px;
            height: 76px;
            overflow: hidden;
            font-size: 60px;
            font-weight: 700;
            /* Неоновый бирюзовый цвет цифр */
            color: #00f2fe;
            /* Сочное двойное свечение текста цифр */
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.8),
            0 0 20px rgba(0, 242, 254, 0.4);
            font-family: 'Courier New', Courier, monospace; /* Придает технологичный вид */
        }

        .digit-tape {
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .digit {
            width: 48px;
            height: 76px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

<h1 id="main-title">До Нового Года осталось</h1>

<div class="clock-wrapper">
    <!-- Дни -->
    <div class="time-group">
        <div class="counter-container">
            <div class="digit-box"><div class="digit-tape" id="d-hundreds"></div></div>
            <div class="digit-box"><div class="digit-tape" id="d-tens"></div></div>
            <div class="digit-box"><div class="digit-tape" id="d-ones"></div></div>
        </div>
        <div class="time-label">Дней</div>
    </div>

    <!-- Часы -->
    <div class="time-group">
        <div class="counter-container">
            <div class="digit-box"><div class="digit-tape" id="h-tens"></div></div>
            <div class="digit-box"><div class="digit-tape" id="h-ones"></div></div>
        </div>
        <div class="time-label">Часов</div>
    </div>

    <!-- Минуты -->
    <div class="time-group">
        <div class="counter-container">
            <div class="digit-box"><div class="digit-tape" id="m-tens"></div></div>
            <div class="digit-box"><div class="digit-tape" id="m-ones"></div></div>
        </div>
        <div class="time-label">Минут</div>
    </div>

    <!-- Секунды -->
    <div class="time-group">
        <div class="counter-container">
            <div class="digit-box"><div class="digit-tape" id="s-tens"></div></div>
            <div class="digit-box"><div class="digit-tape" id="s-ones"></div></div>
        </div>
        <div class="time-label">Секунды</div>
    </div>
</div>

<script>
    const digitHeight = 76; // Соответствует новой высоте CSS
    let timeOffset = 0;

    // Генерация барабанов 0-9
    const tapes = ['d-hundreds', 'd-tens', 'd-ones', 'h-tens', 'h-ones', 'm-tens', 'm-ones', 's-tens', 's-ones'];
    tapes.forEach(id => {
        const el = document.getElementById(id);
        for(let i = 0; i <= 9; i++) {
            const div = document.createElement('div');
            div.className = 'digit';
            div.innerText = i;
            el.appendChild(div);
        }
    });

    function moveTape(tapeId, value) {
        const tape = document.getElementById(tapeId);
        if (tape) {
            tape.style.transform = `translateY(-${value * digitHeight}px)`;
        }
    }

    function updateDisplay(days, hours, minutes, seconds) {
        moveTape('d-hundreds', Math.floor(days / 100));
        moveTape('d-tens', Math.floor((days % 100) / 10));
        moveTape('d-ones', days % 10);

        moveTape('h-tens', Math.floor(hours / 10));
        moveTape('h-ones', hours % 10);

        moveTape('m-tens', Math.floor(minutes / 10));
        moveTape('m-ones', minutes % 10);

        moveTape('s-tens', Math.floor(seconds / 10));
        moveTape('s-ones', seconds % 10);
    }

    function calculateCountdown() {
        const now = new Date(Date.now() + timeOffset);
        const currentYear = now.getFullYear();
        const nextNewYear = new Date(currentYear + 1, 0, 1, 0, 0, 0);
        const diff = nextNewYear - now;

        if (diff <= 0) {
            document.getElementById('main-title').innerText = "HAPPY NEW YEAR! 🎄";
            document.getElementById('main-title').style.textShadow = "0 0 15px #7f00ff, 0 0 30px #7f00ff";
            updateDisplay(0, 0, 0, 0);
            return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / 1000 / 60) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        updateDisplay(days, hours, minutes, seconds);
    }

    async function syncTime() {
        try {
            const startTime = Date.now();
            const response = await fetch('/api/value');
            if (response.ok) {
                const serverTime = await response.json();
                const endTime = Date.now();
                const latency = (endTime - startTime) / 2;
                timeOffset = (serverTime + latency) - endTime;
            }
        } catch (error) {
            console.error("Синхронизация отключена, используются локальные часы:", error);
        }
    }

    async function init() {
        await syncTime();
        calculateCountdown();
        setInterval(calculateCountdown, 1000);
        setInterval(syncTime, 60000);
    }

    init();
</script>
</body>
</html>
