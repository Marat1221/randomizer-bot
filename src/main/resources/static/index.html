        preloader.style.opacity = '0';
        setTimeout(() => { preloader.style.display = 'none'; }, 600);
    });

    function setupCanvas(canvas) {
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        const ctx = canvas.getContext('2d');
        ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.scale(dpr, dpr); return ctx;
    }

    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const bgMusic = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-btn');
    const iconSpan = musicBtn.querySelector('.icon');

    function toggleMenu() {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
    }
    menuBtn.addEventListener('click', toggleMenu);
    overlay.addEventListener('click', toggleMenu);

    async function loadEvents() {
        try {
            const response = await fetch('/api/events');
            if (response.ok) {
                allEvents = await response.json();
                renderMenu();
                const hash = window.location.hash.substring(1);
                const startEvent = allEvents.find(e => e.id === hash) || allEvents[0];
                selectEvent(startEvent.id);
            }
        } catch (e) {
            console.error("Ошибка загрузки событий", e);
            document.getElementById('main-title').innerText = "Ошибка загрузки";
        }
    }

    function renderMenu() {
        const container = document.getElementById('menu-items-container');
        container.innerHTML = '';
        allEvents.forEach(event => {
            const btn = document.createElement('div');
            btn.className = 'menu-item';
            btn.dataset.id = event.id;
            btn.innerText = event.name.replace('До ', '');
            btn.onclick = () => { selectEvent(event.id); toggleMenu(); };
            container.appendChild(btn);
        });
    }

    function selectEvent(id) {
        currentEvent = allEvents.find(e => e.id === id);
        if (!currentEvent) return;

        document.querySelectorAll('.menu-item').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.id === id);
        });

        document.body.className = '';
        if (id === 'newyear') {
            document.body.classList.add('theme-newyear'); isSnowEnabled = true;
        } else if (id === 'ramadan') {
            document.body.classList.add('theme-ramadan'); isSnowEnabled = false;
            snowCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        } else {
            document.body.classList.add('theme-birthday'); isSnowEnabled = false;
            snowCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        }

        // === УМНАЯ ЗАГРУЗКА МУЗЫКИ ===
        const wasPlaying = !bgMusic.paused;
        const newTrack = musicMap[id] || '/music.mp3';

        // Если трек меняется, показываем загрузку
        if (bgMusic.src.indexOf(newTrack) === -1) {
            iconSpan.textContent = '⏳';
            musicBtn.disabled = true;
            bgMusic.src = newTrack;
            bgMusic.load();

            // Ждем, пока трек загрузится
            bgMusic.addEventListener('canplay', function onCanPlay() {
                musicBtn.disabled = false;
                iconSpan.textContent = wasPlaying ? '🎶' : '🎵';
                if (wasPlaying) bgMusic.play().catch(e => console.log("Autoplay blocked"));
                bgMusic.removeEventListener('canplay', onCanPlay); // Убираем слушатель
            });
        }

        const mainTitle = document.getElementById('main-title');
        const clockWrapper = document.getElementById('main-clock');
        mainTitle.classList.add('fade-out');
        clockWrapper.classList.add('fade-out');

        setTimeout(() => {
            mainTitle.innerText = currentEvent.name;
            let parsedDate = new Date(currentEvent.date);
            let now = new Date(Date.now() + timeOffset);
            while (parsedDate < now) { parsedDate.setFullYear(parsedDate.getFullYear() + 1); }
            targetDate = parsedDate;
            window.history.replaceState(null, null, '#' + id);
            calculateCountdown();
            mainTitle.classList.remove('fade-out');
            clockWrapper.classList.remove('fade-out');
        }, 400);
    }

    bgMusic.volume = 0.15;
    musicBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (musicBtn.disabled) return; // Если грузится, ничего не делаем
        if (bgMusic.paused) {
            bgMusic.play().then(() => { iconSpan.textContent = '🎶'; musicBtn.classList.add('playing'); }).catch(() => {});
        } else {
            bgMusic.pause(); iconSpan.textContent = '🎵'; musicBtn.classList.remove('playing');
        }
    });

    const tapes = ['d-hundreds', 'd-tens', 'd-ones', 'h-tens', 'h-ones', 'm-tens', 'm-ones', 's-tens', 's-ones'];
    tapes.forEach(id => {
        const el = document.getElementById(id);
        for (let i = 0; i <= 9; i++) {
            const div = document.createElement('div'); div.className = 'digit'; div.innerText = i; el.appendChild(div);
        }
    });

    function recalcDigitHeight() { const sample = document.querySelector('.digit-box'); if (sample) digitHeight = sample.offsetHeight; }
    recalcDigitHeight();

    function moveTape(tapeId, value) {
        const tape = document.getElementById(tapeId);
        if (tape && tape.dataset.currentValue !== String(value)) {
            tape.dataset.currentValue = value;
            tape.style.transform = `translate3d(0, -${value * digitHeight}px, 0)`;
        }
    }

    function updateDisplay(days, hours, minutes, seconds) {
        moveTape('d-hundreds', Math.floor(days / 100)); moveTape('d-tens', Math.floor((days % 100) / 10)); moveTape('d-ones', days % 10);
        moveTape('h-tens', Math.floor(hours / 10)); moveTape('h-ones', hours % 10);
        moveTape('m-tens', Math.floor(minutes / 10)); moveTape('m-ones', minutes % 10);
        moveTape('s-tens', Math.floor(seconds / 10)); moveTape('s-ones', seconds % 10);
    }

    function calculateCountdown() {
        if (!targetDate) return;
        const now = new Date(Date.now() + timeOffset);
        const diff = targetDate - now;
        if (diff <= 0) { updateDisplay(0, 0, 0, 0); return; }
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / 1000 / 60) % 60);
        const seconds = Math.floor((diff / 1000) % 60);
        updateDisplay(days, hours, minutes, seconds);
    }

    const starsCtx = setupCanvas(document.getElementById('stars-canvas'));
    const stars = [];
    for (let i = 0; i < (isMobile ? 40 : 180); i++) {
        stars.push({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight * 0.7, r: Math.random() * 1.4 + 0.3, phase: Math.random() * Math.PI * 2, speed: Math.random() * 0.02 + 0.01, baseAlpha: Math.random() * 0.5 + 0.4 });
    }
    let lastStarTime = 0;
    function drawStars(timestamp) {
        if (timestamp - lastStarTime < 16) { requestAnimationFrame(drawStars); return; }
        lastStarTime = timestamp;
        const w = window.innerWidth, h = window.innerHeight;
        starsCtx.clearRect(0, 0, w, h);
        for (const s of stars) {
            s.phase += s.speed; const twinkle = Math.sin(s.phase) * 0.5 + 0.5;
            starsCtx.fillStyle = `rgba(200, 230, 255, ${s.baseAlpha * (0.4 + twinkle * 0.6)})`;
            starsCtx.beginPath(); starsCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2); starsCtx.fill();
        }
        requestAnimationFrame(drawStars);
    }
    requestAnimationFrame(drawStars);

    const snowCtx = setupCanvas(document.getElementById('snow-canvas'));
    let flakes = []; let wind = 0;
    function createFlakes() {
        flakes = [];
        const count = isMobile ? 25 : 80;
        for (let i = 0; i < count; i++) {
            const size = Math.random() * 2 + 0.8;
            flakes.push({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, r: size, speed: Math.random() * 0.8 + 0.3 + size / 4, sway: Math.random() * 0.015, swayPhase: Math.random() * Math.PI * 2, alpha: Math.random() * 0.4 + 0.3 });
        }
    }
    createFlakes();
    let lastSnowTime = 0;
    function drawSnow(timestamp) {
        if (timestamp - lastSnowTime < 16) { requestAnimationFrame(drawSnow); return; }
        lastSnowTime = timestamp;
        if (!isSnowEnabled) { requestAnimationFrame(drawSnow); return; }

        const w = window.innerWidth, h = window.innerHeight;
        snowCtx.clearRect(0, 0, w, h); wind = Math.sin(Date.now() / 4000) * 0.4;
        snowCtx.fillStyle = 'rgba(220, 240, 255, 0.8)';
        for (const f of flakes) {
            snowCtx.beginPath(); snowCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2); snowCtx.fill();
            f.y += f.speed; f.swayPhase += f.sway; f.x += Math.sin(f.swayPhase) * 0.6 + wind;
            if (f.y > h + 10) { f.y = -10; f.x = Math.random() * w; }
        }
        requestAnimationFrame(drawSnow);
    }
    requestAnimationFrame(drawSnow);

    async function syncTime() {
        try {
            const startTime = Date.now();
            const response = await fetch('/api/value');
            if (response.ok) { const serverTime = await response.json(); timeOffset = (serverTime + (Date.now() - startTime) / 2) - Date.now(); }
        } catch (e) {}
    }

    window.addEventListener('resize', () => {
        setupCanvas(document.getElementById('stars-canvas'));
        setupCanvas(document.getElementById('snow-canvas'));
        recalcDigitHeight(); createFlakes(); calculateCountdown();
    });

    async function init() {
        await syncTime();
        await loadEvents();
        setInterval(calculateCountdown, 1000);
    }
    init();
</script>
</body>
</html>
