<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Countdown Hub — Счётчики событий</title>
    <meta name="description" content="Красивые онлайн-таймеры обратного отсчёта до Нового Года, Рамадана и других событий. Выберите праздник и узнайте, сколько дней осталось.">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; min-height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { display: flex; flex-direction: column; background: linear-gradient(-45deg, #0a1428, #1a1a3e, #2a1a4a, #0a1428); background-size: 400% 400%; animation: gradientBG 18s ease infinite; color: #fff; overflow-x: hidden; }
        @keyframes gradientBG { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

        /* ФОН */
        .bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; z-index: 0; }
        .orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.5; will-change: transform; }
        .orb-1 { width: 350px; height: 350px; top: -10%; left: -10%; background: radial-gradient(circle, #00f2fe, transparent 70%); animation: float1 20s ease-in-out infinite; }
        .orb-2 { width: 400px; height: 400px; bottom: -15%; right: -10%; background: radial-gradient(circle, #b83bff, transparent 70%); animation: float2 25s ease-in-out infinite; }
        .orb-3 { width: 300px; height: 300px; top: 40%; right: 30%; background: radial-gradient(circle, #3bff7d, transparent 70%); animation: float3 22s ease-in-out infinite; opacity: 0.3; }
        .orb-4 { width: 250px; height: 250px; bottom: 20%; left: 20%; background: radial-gradient(circle, #ff3b5c, transparent 70%); animation: float1 28s ease-in-out infinite reverse; opacity: 0.25; }
        @keyframes float1 { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(80px,60px) scale(1.2); } }
        @keyframes float2 { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-100px,-80px) scale(1.15); } }
        @keyframes float3 { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-60px,100px) scale(1.1); } }

        /* ШАПКА */
        .topbar { position: relative; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(10px); background: rgba(10, 20, 40, 0.4); }
        .logo { display: flex; align-items: center; gap: 12px; color: #fff; font-weight: 700; font-size: 18px; letter-spacing: 1px; }
        .logo-icon { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #3b82f6, #b83bff); display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        .live-clock { font-family: 'Courier New', monospace; color: #a8d8ff; font-size: 15px; letter-spacing: 2px; background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(168, 216, 255, 0.2); }

        /* КОНТЕНТ */
        main { position: relative; z-index: 10; padding: 50px 40px 80px; flex: 1; }
        .hero { text-align: center; margin-bottom: 50px; }
        .hero h1 { font-size: 52px; font-weight: 200; letter-spacing: 6px; margin: 0 0 15px; text-transform: uppercase; text-shadow: 0 0 20px rgba(168, 216, 255, 0.8), 0 0 50px rgba(184, 59, 255, 0.4); }
        .hero p { color: #94a3b8; font-size: 16px; margin: 0 0 25px; letter-spacing: 1px; }
        .hero-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 30px; background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.4); color: #a8d8ff; font-size: 13px; font-weight: 600; }
        .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: #3bff7d; animation: pulseDot 1.5s infinite; }
        @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.4); } }

        .hub-container { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; margin-bottom: 70px; }
        .hub-card { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 240px; height: 280px; border-radius: 24px; text-decoration: none; transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); position: relative; overflow: hidden; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); }
        .hub-card::before { content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); transform: skewX(-20deg); transition: 0.7s; }
        .hub-card:hover::before { left: 150%; }
        .hub-card:hover { transform: translateY(-12px) scale(1.04); }
        .hub-icon { font-size: 76px; margin-bottom: 20px; filter: drop-shadow(0 0 20px currentColor); transition: transform 0.4s; }
        .hub-card:hover .hub-icon { transform: scale(1.15) rotate(-5deg); }
        .hub-title { color: #fff; font-size: 20px; font-weight: 600; letter-spacing: 1.5px; }

        .card-newyear:hover { box-shadow: 0 25px 50px rgba(0,0,0,0.6), 0 0 40px rgba(100, 180, 255, 0.6); border-color: #a8d8ff; }
        .card-newyear .hub-icon { color: #a8d8ff; }
        .card-ramadan:hover { box-shadow: 0 25px 50px rgba(0,0,0,0.6), 0 0 40px rgba(255, 215, 0, 0.5); border-color: #ffd700; }
        .card-ramadan .hub-icon { color: #ffd700; }
        .card-birthday:hover { box-shadow: 0 25px 50px rgba(0,0,0,0.6), 0 0 40px rgba(255, 59, 92, 0.5); border-color: #ff3b5c; }
        .card-birthday .hub-icon { color: #ff3b5c; }

        .footer { position: relative; z-index: 10; padding: 30px 40px; border-top: 1px solid rgba(255,255,255,0.08); background: rgba(10, 20, 40, 0.4); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; color: #64748b; font-size: 13px; flex-wrap: wrap; gap: 10px; }

        /* ЧАТ */
        .chat-btn { position: fixed; bottom: 24px; right: 24px; z-index: 100; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(145deg, #3b82f6, #1e40af); border: none; cursor: pointer; font-size: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5); transition: all 0.3s; color: white; }
        .chat-btn:hover { transform: scale(1.1); box-shadow: 0 10px 35px rgba(59, 130, 246, 0.8); }
        .chat-btn .dot { position: absolute; top: 4px; right: 4px; width: 14px; height: 14px; background: #ff3b5c; border-radius: 50%; border: 2px solid #0a1428; animation: pulseDot 2s infinite; }
        .chat-modal { position: fixed; bottom: 100px; right: 24px; width: 340px; max-width: calc(100vw - 48px); height: 480px; max-height: calc(100vh - 120px); background: rgba(10, 20, 40, 0.98); border: 1px solid rgba(140, 190, 255, 0.3); border-radius: 20px; z-index: 99; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.8); opacity: 0; pointer-events: none; transform: translateY(20px) scale(0.95); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); backdrop-filter: blur(20px); }
        .chat-modal.open { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
        .chat-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: 1px solid rgba(140, 190, 255, 0.2); color: #a8d8ff; font-weight: 600; font-size: 16px; }
        #chat-close { background: none; border: none; color: #a8d8ff; font-size: 20px; cursor: pointer; padding: 0; }
        .chat-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .chat-empty { color: #64748b; font-size: 13px; text-align: center; margin-top: 40px; line-height: 1.6; }
        .chat-msg { padding: 10px 14px; border-radius: 14px; max-width: 85%; font-size: 14px; line-height: 1.4; word-wrap: break-word; animation: msgIn 0.3s ease; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .chat-msg.mine { align-self: flex-end; background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border-bottom-right-radius: 4px; }
        .chat-msg.admin { align-self: flex-start; background: linear-gradient(135deg, #10b981, #059669); color: white; border-bottom-left-radius: 4px; }
        .chat-input-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid rgba(140, 190, 255, 0.2); }
        #chat-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(140, 190, 255, 0.3); border-radius: 12px; padding: 10px 14px; color: #fff; font-size: 14px; font-family: inherit; outline: none; }
        #chat-input:focus { border-color: #a8d8ff; box-shadow: 0 0 10px rgba(168, 216, 255, 0.3); }
        #chat-send { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #3b82f6, #2563eb); border: none; color: white; font-size: 18px; cursor: pointer; transition: all 0.2s; }

        @media (max-width: 768px) {
            .topbar { padding: 15px 20px; }
            .logo { font-size: 15px; }
            .logo-icon { width: 30px; height: 30px; font-size: 15px; }
            .live-clock { font-size: 12px; padding: 6px 10px; letter-spacing: 1px; }
            main { padding: 30px 20px 60px; }
            .hero h1 { font-size: 28px; letter-spacing: 4px; }
            .hub-container { flex-direction: column; gap: 15px; align-items: center; margin-bottom: 40px; }
            .hub-card { width: 100%; max-width: 320px; height: 95px; flex-direction: row; justify-content: flex-start; padding-left: 25px; border-radius: 16px; }
            .hub-icon { font-size: 42px; margin-bottom: 0; margin-right: 20px; }
            .hub-title { font-size: 17px; }
            .footer { padding: 20px; font-size: 11px; flex-direction: column; text-align: center; }
            .chat-btn { bottom: 16px; right: 16px; width: 54px; height: 54px; font-size: 22px; }
            .chat-modal { bottom: 80px; right: 12px; left: 12px; width: auto; height: 60vh; }
        }
    </style>
</head>
<body>

<div class="bg-layer">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
</div>

<header class="topbar">
    <div class="logo">
        <div class="logo-icon">⏱</div>
        <span>Countdown Hub</span>
    </div>
    <div class="live-clock" id="live-clock">--:--:--</div>
</header>

<main>
    <div class="hero">
        <h1>Выберите событие</h1>
        <p>Красивые онлайн-таймеры обратного отсчёта</p>
        <div class="hero-badge">
            <div class="pulse-dot"></div>
            <span>3 события онлайн</span>
        </div>
    </div>

    <div class="hub-container">
        <a href="/newyear.html" class="hub-card card-newyear">
            <div class="hub-icon">❄️</div>
            <div class="hub-title">Новый Год</div>
        </a>
        <a href="/ramadan.html" class="hub-card card-ramadan">
            <div class="hub-icon">🌙</div>
            <div class="hub-title">Рамадан</div>
        </a>
        <a href="/birthdays.html" class="hub-card card-birthday">
            <div class="hub-icon">🎂</div>
            <div class="hub-title">Дни рождения</div>
        </a>
    </div>
</main>

<footer class="footer">
    <div>© <span id="current-year">2026</span> Марат | Countdown Hub</div>
    <div>Сделано с ❤️ для праздников</div>
</footer>

<button class="chat-btn" id="chat-btn">💬<div class="dot"></div></button>

<div class="chat-modal" id="chat-modal">
    <div class="chat-header">
        <span>Обратная связь</span>
        <button id="chat-close">✕</button>
    </div>
    <div class="chat-body" id="chat-messages"></div>
    <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Напишите сообщение..." maxlength="500">
        <button id="chat-send">➤</button>
    </div>
</div>

<script>
    // Часы
    function updateClock() {
        const options = { timeZone: 'Asia/Krasnoyarsk', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
        document.getElementById('live-clock').textContent = new Date().toLocaleTimeString('ru-RU', options);
    }
    updateClock();
    setInterval(updateClock, 1000);
    document.getElementById('current-year').textContent = new Date().getFullYear();

    // Чат
    let sessionId = localStorage.getItem('feedback_session');
    if (!sessionId) {
        sessionId = 'u_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 4);
        localStorage.setItem('feedback_session', sessionId);
    }
    let chatHistory = [], lastCount = -1, isClosed = false;
    const chatBtn = document.getElementById('chat-btn'), chatModal = document.getElementById('chat-modal');
    const chatClose = document.getElementById('chat-close'), chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input'), chatSend = document.getElementById('chat-send');
    const chatDot = chatBtn.querySelector('.dot');

    function renderChat() {
        chatMessages.innerHTML = '';
        if (chatHistory.length === 0) chatMessages.innerHTML = '<div class="chat-empty">Привет! 👋<br>Напишите сообщение.</div>';
        chatHistory.forEach(m => {
            const div = document.createElement('div');
            div.className = 'chat-msg ' + (m.type || 'mine');
            div.textContent = m.text;
            chatMessages.appendChild(div);
        });
        if (isClosed) {
            const c = document.createElement('div'); c.className = 'chat-msg error'; c.textContent = 'Диалог завершён.';
            chatMessages.appendChild(c);
        }
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function pollFeedback() {
        try {
            const res = await fetch('/api/feedback/' + sessionId);
            if (!res.ok) return;
            const data = await res.json();
            if (data.messages && data.messages.length !== lastCount) {
                chatHistory = data.messages.map(m => ({ text: m.text, type: m.from === 'admin' ? 'admin' : 'mine' }));
                isClosed = data.closed === true;
                lastCount = data.messages.length;
                renderChat();
                if (isClosed) { chatInput.disabled = true; chatSend.disabled = true; chatInput.placeholder = 'Диалог закрыт'; }
            }
        } catch (e) {}
    }

    chatBtn.onclick = () => { chatModal.classList.add('open'); chatDot.style.display = 'none'; pollFeedback(); setTimeout(() => chatInput.focus(), 300); };
    chatClose.onclick = () => chatModal.classList.remove('open');

    async function sendChat() {
        const text = chatInput.value.trim();
        if (text.length < 2) return;
        if (isClosed) return;
        chatSend.disabled = true; chatInput.disabled = true; chatInput.value = '';
        try {
            const res = await fetch('/api/feedback', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId, message: text })
            });
            await res.text();
            pollFeedback();
        } catch (e) {} finally { if (!isClosed) { chatSend.disabled = false; chatInput.disabled = false; chatInput.focus(); } }
    }
    chatSend.onclick = sendChat;
    chatInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendChat(); });
    setInterval(() => { if (chatModal.classList.contains('open')) pollFeedback(); }, 3000);
</script>
</body>
</html>
